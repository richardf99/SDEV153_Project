<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Joke of the Day - 2RF</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="portal-body">
 <header class="portal-header">
    <div class="portal-brand">
      <img class="portal-logo" src="logo.svg" alt="2RF Gaming Portal logo" />
      <span>2RF Gaming Portal</span>
    </div>
    <nav class="portal-nav">
      <a href="index.html" aria-label="Home">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M3 10.5L12 3l9 7.5" />
          <path d="M5.5 9.5V21h13V9.5" />
        </svg>
        Home
      </a>
      <a href="about.html" aria-label="About">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 10.5V16" />
          <circle cx="12" cy="7.5" r="0.8" fill="currentColor" stroke="none" />
        </svg>
        About
      </a>
    </nav>
  </header>

  <main class="portal-wrap">
    <section class="portal-stage" aria-label="Joke of the Day">

      <div class="portal-top">
        <div class="portal-panel">
          <div class="portal-welcome">
            <h1>Joke of the Day</h1>
            <p>Click for a joke, then reveal the answer.</p>

            <div class="row">
              <button id="jokeBtn" type="button">Tell me a joke</button>
              <button id="answerBtn" type="button">Show Answer</button>
              <button id="copyBtn" type="button">Copy</button>
            </div>

            <div class="status" id="jokeText" role="status" aria-live="polite">
              Ready when you are
            </div>
          </div>
        </div>

        <div class="portal-panel portal-image">
          <img src="myportal.jpeg" alt="Gaming theme" />
        </div>
      </div>

    </section>
  </main>

  <footer class="portal-footer">2RF Interactive</footer>

  <script>
    const jokes = [
      { setup: "Why don’t programmers like nature?", punchline: "Too many bugs." },
      { setup: "Why do programmers prefer dark mode?", punchline: "Because light attracts bugs." },
      { setup: "Why did the developer go broke?", punchline: "Because they used up all their cache." },
      { setup: "Why did the computer show up late?", punchline: "It had a hard drive." },
      { setup: "Why was the JavaScript developer sad?", punchline: "He didn’t Node how to Express himself." },
      { setup: "Why do Python programmers wear glasses?", punchline: "Because they can’t C." },
      { setup: "Why did the programmer quit his job?", punchline: "Because he didn’t get arrays." },
      { setup: "How many programmers does it take to change a light bulb?", punchline: "None. It’s a hardware problem." },
      { setup: "Why do programmers hate spaces?", punchline: "Because they can’t handle them." },
      { setup: "What do you call a programmer from Finland?", punchline: "Nerdic." },
      { setup: "Why did the programmer get kicked out of school?", punchline: "Because he kept breaking the class rules." },
      { setup: "Why do programmers always mix up Christmas and Halloween?", punchline: "Because Oct 31 == Dec 25." },
      { setup: "Why did the programmer go to therapy?", punchline: "Because he had too many unresolved issues." },
      { setup: "Why was the developer unhappy at their job?", punchline: "They wanted arrays." },
      { setup: "Why did the programmer get stuck in the shower?", punchline: "Because the instructions on the shampoo said: Lather, Rinse, Repeat." },
      { setup: "Why do programmers prefer iOS development?", punchline: "Because on Android, they have to deal with Java." },
      { setup: "Why did the programmer bring a ladder to work?", punchline: "Because they were climbing the corporate ladder." }
    ];

    const jokeText = document.getElementById("jokeText");
    let currentJoke = null;

    document.getElementById("jokeBtn").addEventListener("click", () => {
      currentJoke = jokes[Math.floor(Math.random() * jokes.length)];
      jokeText.textContent = currentJoke.setup;
    });

    document.getElementById("answerBtn").addEventListener("click", () => {
      if(!currentJoke){
        jokeText.textContent = "Click 'Tell me a joke' first!";
        return;
      }
      jokeText.textContent = currentJoke.punchline;
    });

    document.getElementById("copyBtn").addEventListener("click", async () => {
      try{
        await navigator.clipboard.writeText(jokeText.textContent);
        const old = jokeText.textContent;
        jokeText.textContent = "Copied!";
        setTimeout(() => jokeText.textContent = old, 800);
      } catch {
        jokeText.textContent = "Copy not supported in this browser.";
      }
    });
  </script>
</body>
</html>
