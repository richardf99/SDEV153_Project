<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guess the Number - 2RF</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="portal-body">
  <header class="portal-header">
    <div class="portal-brand">2RF Gaming Portal</div>
    <nav class="portal-nav">
      <a href="index.html" aria-label="Home">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M3 10.5L12 3l9 7.5" />
          <path d="M5.5 9.5V21h13V9.5" />
        </svg>
        Home
      </a>
      <a href="about.html" aria-current="page" aria-label="About">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 10.5V16" />
          <circle cx="12" cy="7.5" r="0.8" fill="currentColor" stroke="none" />
        </svg>
        About
      </a>
    </nav>
  </header>

  <main class="portal-wrap">
    <section class="portal-stage">
      <div class="portal-top">

        <div class="portal-panel">
          <h1>Guess the Number</h1>
         <p>I’m thinking of a number between <strong>1</strong> and <strong>100</strong>.</p>

          <div class="row">
            <input id="guessInput" type="number" min="1" max="100" placeholder="Enter a number" />
            <button id="guessBtn">Guess</button>
            <button id="resetBtn">Reset</button>
          </div>

          <div class="status" id="statusText">Make your first guess </div>
          <p>Attempts: <span id="attempts">0</span> | <span id="rangeHint">Range: 1–100</span></p>
        </div>

        <div class="portal-panel portal-image">
          <img src="myportal.jpeg" alt="Game image" />
        </div>

      </div>
    </section>
  </main>

  <footer class="portal-footer">2RF Interactive</footer>

<script>
  let secret = Math.floor(Math.random() * 100) + 1;
  let attempts = 0;
  let min = 1, max = 100;

  const input = document.getElementById("guessInput");
  const status = document.getElementById("statusText");
  const attemptsText = document.getElementById("attempts");
  const range = document.getElementById("rangeHint");

  function makeGuess(){
    const guess = Number(input.value);
    if (!input.value) return status.textContent = "Enter a number.";
    if (guess < 1 || guess > 100) return status.textContent = "Keep it between 1 and 100.";

    attempts++;
    attemptsText.textContent = attempts;

    if (guess === secret){
      status.textContent = `Correct! The number was ${secret}.`;
      return;
    }

    if (guess < secret){
      status.textContent = "Too low!";
      if (guess >= min) min = guess + 1;
    } else {
      status.textContent = "Too high!";
      if (guess <= max) max = guess - 1;
    }

    range.textContent = `Range: ${min}–${max}`;
    input.value = "";
    input.focus();
  }

  document.getElementById("guessBtn").onclick = makeGuess;

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") makeGuess();
  });

  document.getElementById("resetBtn").onclick = () => {
    secret = Math.floor(Math.random() * 100) + 1;
    attempts = 0; min = 1; max = 100;
    attemptsText.textContent = 0;
    range.textContent = "Range: 1–100";
    status.textContent = "Game reset. Guess again!";
    input.value = "";
    input.focus();
  };
</script>
</body>
</html>
